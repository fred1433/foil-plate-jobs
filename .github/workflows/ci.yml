name: ci
# Pull requests: build and test in the pinned image. No cloud credentials here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t local/foil:pr .
      - run: docker run --rm -e FOILPLATE_PINNED_IMAGE=1 local/foil:pr python -m pytest -q -p no:cacheprovider tests
