name: ci
# Pull requests and pushes to main: build and test in the pinned image, against a
# throwaway Postgres for the ledger tests. No cloud credentials here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t local/foil:ci .
      - name: Engine, golden, ledger and worker tests in the pinned image
        run: |
          docker run --rm --network host -e FOILPLATE_PINNED_IMAGE=1 \
            -e LEDGER_DSN="postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            local/foil:ci python -m pytest -q -p no:cacheprovider -rs tests | tee pytest.out
          ! grep -q " skipped" pytest.out
