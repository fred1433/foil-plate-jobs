name: deploy
# A merge to main builds the image, runs the engine tests and golden comparison
# inside it, pushes it, and rolls both Cloud Run services to that exact digest.
on:
  push:
    branches: [main]
    paths-ignore: ["evidence/**", "docs/**", "scripts/**", "infra/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy

env:
  PROJECT: foil-plate-jobs-3ceecf
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/foil-plate-jobs-3ceecf/foil/foil-plate-jobs
  WIF_PROVIDER: projects/24496260691/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: deployer@foil-plate-jobs-3ceecf.iam.gserviceaccount.com

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t local/foil:${{ github.sha }} .

      - name: Tests and golden comparison in the pinned image
        run: docker run --rm -e FOILPLATE_PINNED_IMAGE=1 local/foil:${{ github.sha }} python -m pytest -q -p no:cacheprovider tests

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push
        id: push
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker tag local/foil:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }} > /dev/null
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }})
          [[ "$REF" == "$IMAGE@sha256:"* ]] || { echo "unexpected image reference: '$REF'"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Deploy worker and dispatcher
        run: |
          for s in foil-worker foil-dispatcher; do
            gcloud run services update $s --project $PROJECT --region $REGION \
              --image "${{ steps.push.outputs.ref }}" --update-env-vars GIT_COMMIT=${{ github.sha }} --quiet
          done

      - name: Verify and record what serves traffic
        if: always() && steps.push.outputs.ref != ''
        run: |
          {
            echo "### Deployment"
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| pushed image | \`${{ steps.push.outputs.ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          for s in foil-worker foil-dispatcher; do
            # The revision(s) actually receiving traffic, and the image each one runs.
            for rev in $(gcloud run services describe $s --project $PROJECT --region $REGION \
                           --format='value(status.traffic[].revisionName)' | tr ';,' '  '); do
              img=$(gcloud run revisions describe $rev --project $PROJECT --region $REGION \
                      --format='value(spec.containers[0].image)')
              echo "| $s serving | \`$rev\` runs \`$img\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "SERVING service=$s revision=$rev image=$img"
              [ "$img" = "${{ steps.push.outputs.ref }}" ] || FAIL=1
            done
          done
          echo "| checked (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$GITHUB_STEP_SUMMARY"
          [ $FAIL = 0 ] || { echo "a serving revision does not run the pushed image"; exit 1; }
